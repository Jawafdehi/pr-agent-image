# Builds docker.io/jawafdehi/pr-agent from a PINNED commit of the community
# open-source reviewer (The-PR-Agent/pr-agent), --target github_app. We build our
# own image (never an unvetted upstream :latest) because the resulting container
# holds our GitHub App private key. arm64-only: the pod is pinned to the OCI Ampere
# pool. Bump ref/tag deliberately after re-vetting.
#
# Stock upstream, no patches. Up to v0.39.0-approve1 we carried a patch that
# re-enabled upstream's commented-out `/review auto_approve` dispatch so the bot
# could leave an advisory APPROVE; it was dropped in Nov 2026 because the bot
# kept approving PRs even when its review had failed.
name: build-pr-agent-image
on:
  workflow_dispatch:
    inputs:
      ref:
        description: The-PR-Agent/pr-agent commit sha or tag to build
        default: "e673a02076ce09a4726c3d0c3cc85780e59ca52b" # v0.50.0
      tag:
        description: image tag to publish
        default: "v0.50.0"
env:
  IMAGE: jawafdehi/pr-agent
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pinned PR-Agent source
        uses: actions/checkout@v4
        with:
          repository: The-PR-Agent/pr-agent
          ref: ${{ github.event.inputs.ref }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log into Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build & push (github_app target, arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: github_app
          platforms: linux/arm64
          push: true
          tags: docker.io/${{ env.IMAGE }}:${{ github.event.inputs.tag }}
