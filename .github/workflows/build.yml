# Builds docker.io/jawafdehi/pr-agent from a PINNED commit of the community
# open-source reviewer (The-PR-Agent/pr-agent), --target github_app. We build our
# own image (never an unvetted upstream :latest) because the resulting container
# holds our GitHub App private key. Bump `ref`/`tag` deliberately after re-vetting.
name: build-pr-agent-image
on:
  workflow_dispatch:
    inputs:
      ref:
        description: The-PR-Agent/pr-agent commit sha or tag to build
        default: "8e4d32e5497defd43c023a404f73560c62728961"
      tag:
        description: image tag to publish
        default: "v0.39.0"
env:
  IMAGE: jawafdehi/pr-agent
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pinned PR-Agent source
        uses: actions/checkout@v4
        with:
          repository: The-PR-Agent/pr-agent
          ref: ${{ github.event.inputs.ref }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log into Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build & push (github_app target, multi-arch)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: github_app
          platforms: linux/amd64,linux/arm64
          push: true
          tags: docker.io/${{ env.IMAGE }}:${{ github.event.inputs.tag }}
